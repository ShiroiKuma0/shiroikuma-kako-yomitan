# 白い熊 Yomitan — the fork's build counter.
#
# Upstream's version already uses all four components Firefox and AMO allow
# (26.7.29.0 = YY.M.D.counter), so our build number cannot simply be appended.
# Instead the last component carries both: upstream's counter P and our build N,
# as P*100 + N.
#
#     upstream 26.7.29.0 + our build 3  ->  26.7.29.3
#     upstream 26.7.29.1 + our build 3  ->  26.7.29.103
#     upstream 26.7.29.2 + our build 1  ->  26.7.29.201
#
# N must therefore stay below 100; tools/build-fork.mjs refuses to build past that
# rather than emit a version string that lies about its base.
#
# Bumped by every build (tools/build-fork.mjs); reset to 1 by /upstream-new-version,
# which also updates UPSTREAM_BASE to the release tag `custom` was rebased onto.
UPSTREAM_BASE=26.7.29.0
BUILD_NUMBER=4